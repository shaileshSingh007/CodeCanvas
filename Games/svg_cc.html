<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Color Replacer Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles to remove native browser borders on the color picker */
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 0.375rem; }
        input[type="color"]::-moz-color-swatch { border: none; border-radius: 0.375rem; }
    </style>
</head>
<body class="bg-gray-900 h-[100dvh] w-full overflow-hidden flex items-center justify-center sm:p-6 text-gray-200">

    <!-- Mobile-first: full height/width on small screens, rounded card on larger screens -->
    <div class="bg-gray-800 p-5 sm:p-8 sm:rounded-xl shadow-2xl max-w-lg w-full h-full sm:h-auto sm:max-h-full border-0 sm:border border-gray-700 flex flex-col overflow-hidden">
        <h1 class="text-2xl font-bold mb-1 text-white flex-shrink-0">SVG Color Replacer</h1>
        <p class="text-sm text-gray-400 mb-4 flex-shrink-0">Attach an SVG or enter its path, then pick your colors.</p>

        <div class="space-y-4 flex-shrink-0">
            <!-- URL / Attach Input -->
            <div>
                <label class="block text-sm font-semibold text-gray-300 mb-2">SVG URL / File</label>
                <div class="flex gap-2">
                    <input type="text" id="svgUrl" value="icon.svg" class="flex-1 min-w-0 px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400" placeholder="e.g., icon.svg">
                    
                    <input type="file" id="fileInput" accept=".svg" class="hidden">
                    <button id="attachBtn" type="button" title="Attach Local File" class="h-[42px] w-[42px] flex-shrink-0 bg-gray-700 hover:bg-gray-600 border border-gray-600 rounded-lg text-gray-200 flex items-center justify-center transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a3 3 0 00-3 3v4a5 5 0 0010 0V7a1 1 0 112 0v4a7 7 0 11-14 0V7a5 5 0 0110 0v4a3 3 0 11-6 0V7a1 1 0 012 0v4a1 1 0 102 0V7a3 3 0 00-3-3z" clip-rule="evenodd" /></svg>
                    </button>
                </div>
                <p class="text-xs text-gray-500 mt-2">Type a path OR attach a local file directly.</p>
            </div>

            <!-- Color Pickers -->
            <div>
                <div class="flex justify-between items-end mb-2">
                    <label class="block text-sm font-semibold text-gray-300">New Color(s)</label>
                    <span id="colorCountLabel" class="text-xs text-gray-400 font-medium">1/10</span>
                </div>
                
                <div id="colorsContainer" class="flex flex-wrap gap-3 items-center">
                    <!-- Color input squares will be dynamically inserted here -->
                    <button id="addColorBtn" type="button" class="h-10 w-10 flex-shrink-0 rounded-md bg-gray-700 border border-gray-600 flex items-center justify-center hover:bg-gray-600 text-gray-300 transition-colors text-2xl font-light shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        +
                    </button>
                </div>
            </div>

            <!-- Action Button -->
            <button id="processBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 px-4 rounded-lg transition-colors mt-2 shadow-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-800">
                Update SVG & Generate Blob
            </button>
        </div>

        <!-- Error Message Container -->
        <div id="errorMsg" class="hidden mt-4 p-3 bg-red-900/50 text-red-200 text-sm rounded-lg border border-red-800 break-words flex-shrink-0">
        </div>

        <!-- Result Container (Fills exact remaining space without overflow) -->
        <div id="resultContainer" class="mt-4 flex flex-col flex-1 min-h-0 border-t border-gray-700 pt-4">
            <span class="text-xs font-semibold text-gray-500 mb-2 flex-shrink-0 uppercase tracking-wider">Preview</span>
            
            <div class="relative bg-gray-900 border border-gray-700 rounded-lg p-3 flex justify-center items-center flex-1 min-h-0 w-full group overflow-hidden">
                <!-- Initial Placeholder text -->
                <span id="previewPlaceholder" class="text-gray-500 text-sm text-center">Your modified SVG will appear here</span>
                
                <!-- The actual image (hidden until loaded). object-contain makes it scale nicely within bounds -->
                <img id="resultImg" class="w-full h-full object-contain hidden" alt="Modified SVG">
                
                <!-- Download Button Icon (Floating in corner) -->
                <a id="downloadLink" href="#" download="modified-icon.svg" title="Download SVG" class="hidden absolute bottom-3 right-3 p-2 bg-gray-800 border border-gray-600 hover:bg-gray-700 hover:border-gray-500 text-blue-400 hover:text-blue-300 rounded-md shadow-lg transition-all z-10">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                </a>
            </div>
        </div>
    </div>

    <script>
        // --- State ---
        const MAX_COLORS = 10;
        let selectedFile = null;

        // --- DOM Elements ---
        const colorsContainer = document.getElementById('colorsContainer');
        const addColorBtn = document.getElementById('addColorBtn');
        const colorCountLabel = document.getElementById('colorCountLabel');
        
        const attachBtn = document.getElementById('attachBtn');
        const fileInput = document.getElementById('fileInput');
        const svgUrlInput = document.getElementById('svgUrl');

        // --- File Attachment Logic ---
        attachBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                svgUrlInput.value = selectedFile.name; // Show file name visually
            }
        });

        // If user modifies the text manually, disconnect the attached file
        svgUrlInput.addEventListener('input', () => {
            selectedFile = null; 
        });

        // --- Color UI Logic ---
        function createColorNode(initialColor = '#ff0000') {
            const inputs = colorsContainer.querySelectorAll('.color-node');
            if (inputs.length >= MAX_COLORS) return;

            const wrapper = document.createElement('div');
            wrapper.className = 'relative group color-node';

            // The square color picker
            const input = document.createElement('input');
            input.type = 'color';
            input.value = initialColor;
            input.className = 'h-10 w-10 cursor-pointer bg-transparent block shadow-sm';

            // Hover close button
            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.innerHTML = '&times;';
            removeBtn.className = 'absolute -top-2 -right-2 bg-red-500 hover:bg-red-400 text-white rounded-full w-5 h-5 flex items-center justify-center text-sm opacity-0 group-hover:opacity-100 transition-opacity shadow-md focus:outline-none focus:opacity-100';
            
            removeBtn.addEventListener('click', () => {
                wrapper.remove();
                updateColorUI();
            });

            wrapper.appendChild(input);
            wrapper.appendChild(removeBtn);
            
            // Insert it just before the '+' button
            colorsContainer.insertBefore(wrapper, addColorBtn);
            updateColorUI();
        }

        function updateColorUI() {
            const currentNodes = colorsContainer.querySelectorAll('.color-node');
            colorCountLabel.textContent = `${currentNodes.length}/${MAX_COLORS}`;
            
            // Hide the Add button if maxed out
            if (currentNodes.length >= MAX_COLORS) {
                addColorBtn.classList.add('hidden');
            } else {
                addColorBtn.classList.remove('hidden');
            }

            // Hide the 'x' button on the first one if it is the ONLY one left
            currentNodes.forEach((node, index) => {
                const btn = node.querySelector('button');
                if (currentNodes.length === 1) {
                    btn.classList.add('hidden');
                } else {
                    btn.classList.remove('hidden');
                }
            });
        }

        addColorBtn.addEventListener('click', () => createColorNode('#ffffff'));
        createColorNode('#ff0000'); // Initialize default


        // --- Core SVG Processing Logic ---
        
        function fetchSvgTextSync(url) {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', url, false); 
            xhr.send(null);
            
            if (xhr.status !== 200 && xhr.status !== 0) {
                throw new Error(`Network response was not ok: ${xhr.status}`);
            }
            if (!xhr.responseText) {
                throw new Error("Failed to load SVG content. Try using the Attach button instead.");
            }
            return xhr.responseText;
        }

        function processSvgAndCreateBlob(svgText, colorsArray) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(svgText, "image/svg+xml");

            let colorIndex = 0;
            const elements = doc.querySelectorAll('*');
            
            elements.forEach(el => {
                let modified = false;
                const currentColor = colorsArray[colorIndex % colorsArray.length];

                // Override fill
                if (el.hasAttribute('fill') && el.getAttribute('fill') !== 'none') {
                    el.setAttribute('fill', currentColor);
                    modified = true;
                }
                // Override stroke
                if (el.hasAttribute('stroke') && el.getAttribute('stroke') !== 'none') {
                    el.setAttribute('stroke', currentColor);
                    modified = true;
                }
                // Override inline CSS
                if (el.style) {
                    if (el.style.fill && el.style.fill !== 'none') {
                        el.style.fill = currentColor;
                        modified = true;
                    }
                    if (el.style.stroke && el.style.stroke !== 'none') {
                        el.style.stroke = currentColor;
                        modified = true;
                    }
                }

                if (modified) colorIndex++;
            });
            
            const serializer = new XMLSerializer();
            const newSvgText = serializer.serializeToString(doc.documentElement);

            return new Blob([newSvgText], { type: 'image/svg+xml' });
        }


        // --- Execution Handler ---
        document.getElementById('processBtn').addEventListener('click', async () => {
            const errorContainer = document.getElementById('errorMsg');
            const resultImg = document.getElementById('resultImg');
            const downloadLink = document.getElementById('downloadLink');
            const placeholder = document.getElementById('previewPlaceholder');

            errorContainer.classList.add('hidden');

            try {
                // 1. Gather Colors
                const colorInputs = colorsContainer.querySelectorAll('input[type="color"]');
                const colorsArray = Array.from(colorInputs).map(input => input.value);

                if (colorsArray.length === 0) throw new Error("Please add at least one color.");

                // 2. Get SVG Text (Either Async File Upload or Sync URL fetch)
                let rawSvgText = "";
                
                if (selectedFile) {
                    rawSvgText = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = e => resolve(e.target.result);
                        reader.onerror = () => reject(new Error("Failed to read attached file."));
                        reader.readAsText(selectedFile);
                    });
                } else {
                    const url = svgUrlInput.value.trim();
                    if (!url) throw new Error("Please enter a URL or attach a file.");
                    rawSvgText = fetchSvgTextSync(url);
                }

                // 3. Process into Blob
                const blob = processSvgAndCreateBlob(rawSvgText, colorsArray);
                
                // 4. Render
                const objectUrl = URL.createObjectURL(blob);
                resultImg.src = objectUrl;
                downloadLink.href = objectUrl;
                
                // Toggle UI elements
                placeholder.classList.add('hidden');
                resultImg.classList.remove('hidden');
                downloadLink.classList.remove('hidden');

            } catch (error) {
                errorContainer.textContent = error.message;
                errorContainer.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
