                        fps: app.state.fps,
                        scenes: app.scenes.list
                    };
                    
                    const jsonString = JSON.stringify(projectData);
                    const blob = new Blob([jsonString], { type: "application/json" });
                    const url = URL.createObjectURL(blob);
                    
                    this.showDownloadModal(url, "LumiFrame_Project.json", 'json');
                },
                
                exportFrame: function() {
                    document.getElementById('export-menu').classList.remove('active');
                    app.frames.saveCurrentFrame();
                    
                    // Discard active selections so they aren't captured in the image
                    app.canvas.discardActiveObject();
                    app.canvas.renderAll();
                    
                    // Take exact 1:1 snapshot directly from the main canvas logic (maintains transparency!)
                    const dataURL = app.canvas.toDataURL({
                        format: 'png',
                        multiplier: 1,
                        enableRetinaScaling: false
                    });
                    
                    const scene = app.scenes.getActive();
                    const fileName = `LumiFrame_Scene${app.scenes.activeIdx + 1}_Frame${scene.currentIdx + 1}.png`;
                    
                    this.showDownloadModal(dataURL, fileName, 'image');
                },
                
                startExport: async function(format) {
                    document.getElementById('export-menu').classList.remove('active');
                    if (app.state.isPlayingSingle || app.state.isPlayingAll) app.playback.stopLoop(); 
                    app.frames.saveCurrentFrame();
                    
                    const expCanvas = document.createElement('canvas'); 
                    expCanvas.width = app.state.width; expCanvas.height = app.state.height;
                    
                    if (!expCanvas.captureStream) {
                        return app.ui.showAlert("Video export not supported in this browser.");
                    }
                    
                    document.getElementById('modal-export').style.display = 'flex';
                    const progress = document.getElementById('export-progress'), statusText = document.getElementById('export-status');
                    
                    const expCtx = expCanvas.getContext('2d');
                    const stream = expCanvas.captureStream(app.state.fps);
                    
                    let mimeType = 'video/webm';
                    if (MediaRecorder.isTypeSupported('video/webm; codecs=vp9')) mimeType = 'video/webm; codecs=vp9';
                    else if (MediaRecorder.isTypeSupported('video/mp4')) mimeType = 'video/mp4';
                    
                    const recorder = new MediaRecorder(stream, { mimeType: mimeType }); 
                    const chunks = [];
                    
                    recorder.ondataavailable = e => chunks.push(e.data);
                    recorder.onstop = () => {
                        const blob = new Blob(chunks, { type: mimeType }); 
                        const url = URL.createObjectURL(blob);
                        const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
                        
                        document.getElementById('modal-export').style.display = 'none';
                        app.frames.loadFrame(app.scenes.getActive().currentIdx);
                        
                        app.export.showDownloadModal(url, `LumiFrame_Export.${ext}`, 'video');
                    };
                    
                    recorder.start(); 
                    const timePerFrame = 1000 / app.state.fps;
                    
                    // Flatten all frames from all scenes
                    let allFrames = [];
                    app.scenes.list.forEach(sc => allFrames = allFrames.concat(sc.frames));
                    
                    for (let i = 0; i < allFrames.length; i++) {
                        statusText.textContent = `Rendering Frame ${i + 1} of ${allFrames.length}`; 
                        progress.style.width = `${((i + 1) / allFrames.length) * 100}%`;
                        await new Promise(resolve => {
                            const tempFab = new fabric.StaticCanvas(null, { width: app.state.width, height: app.state.height });
                            if (allFrames[i].data) {
                                tempFab.loadFromJSON(allFrames[i].data, () => {
                                    tempFab.renderAll();
                                    expCtx.fillStyle = '#ffffff'; expCtx.fillRect(0,0, expCanvas.width, expCanvas.height);
                                    expCtx.drawImage(tempFab.getElement(), 0, 0, app.state.width, app.state.height); resolve();
                                });
                            } else { expCtx.fillStyle = '#ffffff'; expCtx.fillRect(0,0, expCanvas.width, expCanvas.height); resolve(); }
                        });
                        await new Promise(r => setTimeout(r, timePerFrame));
                    }
                    recorder.stop();
                }
            },

            ui: {
                showAlert: function(msg, isSuccess = false) {
                    let existing = document.getElementById('custom-alert-toast');
                    if (existing) existing.remove();
                    
                    const alertBox = document.createElement('div');
                    alertBox.id = 'custom-alert-toast';
                    alertBox.style.cssText = `
                        position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
                        background: ${isSuccess ? 'var(--success)' : 'var(--danger)'};
                        color: white; padding: 12px 20px; border-radius: 25px;
                        z-index: 100000; font-size: 14px; font-weight: bold;
                        box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center;
                        animation: slideDownToast 0.3s ease-out; white-space: nowrap;
                    `;
                    alertBox.textContent = msg;
                    
                    // Inject CSS animation directly to DOM if not present
                    if (!document.getElementById('toast-anim')) {
                        const style = document.createElement('style');
                        style.id = 'toast-anim';
                        style.innerHTML = `@keyframes slideDownToast { from { opacity: 0; transform: translate(-50%, -20px); } to { opacity: 1; transform: translate(-50%, 0); } }`;
                        document.head.appendChild(style);
                    }

                    document.body.appendChild(alertBox);
                    
                    setTimeout(() => { 
                        if (alertBox.parentNode) {
                            alertBox.style.opacity = '0';
                            alertBox.style.transition = '0.2s';
                            setTimeout(() => { if (alertBox.parentNode) alertBox.remove(); }, 200);
                        }
                    }, 2500);
                },
                updateTimeline: function() {
                    const track = document.getElementById('timeline-tracks'); track.innerHTML = '';
                    const scene = app.scenes.getActive();
                    scene.frames.forEach((frame, idx) => {
                        const thumb = document.createElement('div');
                        thumb.className = `frame-thumb ${idx === scene.currentIdx ? 'active' : ''}`;
                        thumb.onclick = () => app.frames.loadFrame(idx);
                        thumb.innerHTML = `<img id="thumb-img-${idx}" src="${frame.thumb || 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'}"><div class="frame-num">${idx + 1}</div>`;
                        track.appendChild(thumb);
                        if (idx === scene.currentIdx) thumb.scrollIntoView({ behavior: 'auto', block: 'nearest', inline: 'center' });
                    });
                    const addBtn = document.createElement('button'); addBtn.className = 'frame-add-btn'; addBtn.innerHTML = '<i class="fa-solid fa-plus"></i>';
                    addBtn.onclick = () => app.frames.addFrame(); track.appendChild(addBtn);
                },
                updateTimelineActiveOnly: function() {
                    const scene = app.scenes.getActive();
                    document.querySelectorAll('.frame-thumb').forEach((el, idx) => {
                        if (idx === scene.currentIdx) { el.classList.add('active'); el.scrollIntoView({ behavior: 'auto', block: 'nearest', inline: 'center' }); } 
                        else el.classList.remove('active');
                    });
                },
                hideSubs: function() {
                    document.querySelectorAll('.sub-toolbar').forEach(el => el.classList.remove('active'));
                },
                toggleSub: function(id) {
                    const el = document.getElementById(id);
                    const isActive = el.classList.contains('active');
                    this.hideSubs();
                    if(!isActive) el.classList.add('active');
                },
                setActiveSubBtn: function(btn, parentId) {
                    document.querySelectorAll(`#${parentId} .sub-tool-btn`).forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                }
            },
            
            clipboard: {
                data: null,
                copy: function() {
                    const obj = app.canvas.getActiveObject();
                    if(obj) {
                        this.data = JSON.stringify(obj.toJSON(['id', 'clipPath', 'filters']));
                        document.getElementById('btn-paste').removeAttribute('disabled');
                        app.ui.showAlert("Object Copied!", true);
                    }
                },
                paste: function() {
                    if(!this.data) return;
                    const parsedData = JSON.parse(this.data);
                    parsedData.id = 'obj_' + Date.now() + Math.floor(Math.random() * 1000); 
                    
                    fabric.util.enlivenObjects([parsedData], (objs) => {
                        const clone = objs[0];
                        app.canvas.add(clone);
                        app.canvas.setActiveObject(clone);
                        app.tools.setTool('select');
                        app.canvas.requestRenderAll();
                        app.requestSave();
                    });
                }
            }
        };

        window.onload = () => { app.init(); };
    </script>
</body>
</html>
