<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
    <title>LumiFrame - Mobile Studio</title>
    
    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Dark Theme Minimalist Colors */
            --bg-base: #121212;
            --bg-panel: #1e1e1e;
            --bg-panel-light: #2c2c2c;
            --border-color: #333333;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --danger: #ef4444;
            
            --nav-h: 60px;
            --header-h: 50px;
            --timeline-h: 75px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

        html, body {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            overflow: hidden !important; overscroll-behavior: none; touch-action: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-base); color: var(--text-main); display: flex; flex-direction: column;
        }

        button {
            background: none; border: none; color: var(--text-main); cursor: pointer;
            font-family: inherit; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; transition: 0.1s;
        }
        button:active { transform: scale(0.95); }
        button:disabled { opacity: 0.5; pointer-events: none; }
        
        input, select {
            background: var(--bg-base); border: 1px solid var(--border-color); color: var(--text-main);
            padding: 8px 12px; border-radius: 8px; font-size: 14px; outline: none; width: 100%;
        }
        input:focus, select:focus { border-color: var(--accent); }
        input[type="range"] { accent-color: var(--accent); padding: 0; border: none;}
        input[type="text"] { user-select: auto; } 
        
        .color-picker-wrapper {
            position: relative; width: 36px; height: 36px; border-radius: 50%;
            overflow: hidden; border: 2px solid var(--border-color); display: flex; align-items: center; justify-content: center;
        }
        .color-picker-wrapper input[type="color"] { position: absolute; width: 150%; height: 150%; top: -25%; left: -25%; cursor: pointer; border: none; padding: 0; }

        /* --- HEADER --- */
        .app-header {
            height: var(--header-h); background: var(--bg-panel); display: flex;
            align-items: center; justify-content: space-between; padding: 0 15px; box-shadow: 0 1px 10px rgba(0,0,0,0.3); z-index: 50;
        }
        .header-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .header-btn { width: 36px; height: 36px; font-size: 16px; background: var(--bg-panel-light); border-radius: 50%; }
        .header-actions { display: flex; gap: 10px; }
        .play-btn.active { color: var(--accent); }

        /* --- WORKSPACE --- */
        .workspace {
            flex: 1; position: relative; background: var(--bg-base);
            overflow: hidden !important; display: flex; align-items: center; justify-content: center; touch-action: none;
        }
        .canvas-wrapper {
            position: relative; box-shadow: 0 4px 30px rgba(0,0,0,0.5); overflow: hidden; flex-shrink: 0; 
            background-image: linear-gradient(45deg, #222 25%, transparent 25%), linear-gradient(135deg, #222 25%, transparent 25%),
                              linear-gradient(45deg, transparent 75%, #222 75%), linear-gradient(135deg, transparent 75%, #222 75%);
            background-size: 20px 20px; background-position: 0 0, 10px 0, 10px -10px, 0px 10px; background-color: #1a1a1a;
            transform-origin: center center; transition: transform 0.1s ease-out;
        }
        .canvas-layer { position: absolute; top: 0; left: 0; pointer-events: none; }
        #main-canvas-container { position: relative; z-index: 10; }
        #main-canvas-container canvas { pointer-events: auto; touch-action: none; }
        
        /* Alignment Snap Guides */
        .snap-guide {
            position: absolute; background: var(--accent); display: none; pointer-events: none;
            z-index: 999; box-shadow: 0 0 6px var(--accent);
        }
        #guide-v { top: 0; left: 50%; width: 2px; height: 100%; transform: translateX(-50%); }
        #guide-h { top: 50%; left: 0; width: 100%; height: 2px; transform: translateY(-50%); }

        /* --- FLOATING CONTROLS (EDIT DROPDOWN) --- */
        .floating-controls { position: absolute; right: 15px; top: 15px; display: flex; flex-direction: column; align-items: center; z-index: 100; }
        .floating-btn { width: 40px; height: 40px; background: rgba(30, 30, 30, 0.8); backdrop-filter: blur(5px); border: 1px solid var(--border-color); border-radius: 50%; font-size: 14px; transition: 0.2s; color: var(--text-main); }
        .floating-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .floating-dropdown-menu { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; overflow: hidden; max-height: 0; opacity: 0; transition: max-height 0.3s ease, opacity 0.3s ease; }
        .floating-dropdown-menu.open { max-height: 250px; opacity: 1; }

        /* --- TIMELINE --- */
        .timeline-bar {
            height: var(--timeline-h); background: var(--bg-panel); display: flex; align-items: center; padding: 0 10px; gap: 10px;
            overflow-x: auto; overflow-y: hidden; white-space: nowrap; border-bottom: 1px solid var(--border-color); scrollbar-width: none;
        }
        .timeline-bar::-webkit-scrollbar { display: none; }
        .frame-thumb { width: 50px; height: 55px; background: var(--bg-base); border: 2px solid transparent; border-radius: 6px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; cursor: pointer; }
        .frame-thumb.active { border-color: var(--accent); }
        .frame-thumb img { max-width: 100%; max-height: 100%; background: white;}
        .frame-num { position: absolute; bottom: 0; left: 0; width: 100%; font-size: 9px; text-align: center; background: rgba(0,0,0,0.6); padding: 2px 0; }
        .frame-add-btn { width: 40px; height: 55px; flex-shrink: 0; background: var(--bg-panel-light); border: 1px dashed var(--border-color); border-radius: 6px; color: var(--text-muted); }

        /* --- BOTTOM NAVIGATION --- */
        .bottom-nav {
            height: var(--nav-h); background: var(--bg-panel); display: flex; align-items: center; justify-content: space-around;
            padding: 0 5px; padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-btn { width: 50px; height: 50px; font-size: 20px; color: var(--text-muted); flex-direction: column; gap: 4px; }
        .nav-btn.active { color: var(--accent); }
        .nav-btn-indicator { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
        .nav-btn.active .nav-btn-indicator { background: var(--accent); }

        /* --- MODALS & BOTTOM SHEETS --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px);
            display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: 0.2s; z-index: 1000;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal-overlay.transparent-overlay { background: transparent; backdrop-filter: none; }
        .modal-overlay.transparent-overlay .bottom-sheet { box-shadow: 0 -10px 40px rgba(0,0,0,0.6); border-top: 1px solid var(--border-color);}

        .bottom-sheet {
            background: var(--bg-panel); width: 100%; max-width: 500px; border-radius: 20px 20px 0 0; padding: 20px;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1); max-height: 80vh; overflow-y: auto;
        }
        .modal-overlay.open .bottom-sheet { transform: translateY(0); }
        
        .modal-center {
            background: var(--bg-panel); width: 90%; max-width: 350px; border-radius: 12px; padding: 20px;
            transform: scale(0.9); transition: transform 0.2s; margin-bottom: auto; margin-top: auto;
        }
        .modal-overlay.open .modal-center { transform: scale(1); }
        .sheet-handle { width: 40px; height: 4px; background: var(--border-color); border-radius: 2px; margin: 0 auto 15px auto; }
        
        .btn-list { display: flex; flex-direction: column; gap: 10px; }
        .btn-list-item { width: 100%; padding: 15px; background: var(--bg-panel-light); border-radius: 10px; justify-content: flex-start; gap: 15px; font-size: 15px; }
        .btn-primary { background: var(--accent); color: white; width: 100%; padding: 12px; font-weight: 600;}

        /* --- COMPACT OBJECTS PANEL --- */
        .obj-btn {
            background: var(--bg-panel-light); border: 1px solid transparent; color: var(--text-main);
            border-radius: 8px; padding: 10px; display: flex; align-items: center; justify-content: center;
            flex: 1; font-size: 16px;
        }
        .obj-btn.active-tab { background: var(--accent); color: white; border-color: var(--accent); }
        .obj-tab-content { display: flex; gap: 8px; margin-top: 10px; }

        /* --- FLOATING TEXT EDITOR TOAST --- */
        .text-toast {
            position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-20px);
            width: 92%; max-width: 450px; background: var(--bg-panel-light); border: 1px solid var(--accent);
            border-radius: 12px; padding: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 2000;
            display: flex; flex-direction: column; gap: 8px; opacity: 0; pointer-events: none; transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .text-toast.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
        .text-toast-row { display: flex; gap: 8px; }
        .text-toast-input { flex: 1; background: var(--bg-base); border: 1px solid var(--border-color); color: white; padding: 10px; border-radius: 8px; outline: none; font-size: 15px; }
        .text-toast-input:focus { border-color: var(--accent); }
        .text-toast-btn { background: var(--bg-base); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 10px; flex: 1; display: flex; justify-content: center; align-items: center; font-size: 16px; }
        .text-toast-btn.primary { background: var(--accent); border-color: var(--accent); color: white; flex: 0 0 50px; }
        .text-toast-select { background: var(--bg-base); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 10px; flex: 2; outline: none; font-size: 14px; -webkit-appearance: none; text-align: center;}

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(-45deg, #0f172a, #121212, #050505, #172554); background-size: 400% 400%;
            animation: splashBg 5s ease infinite; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1s ease, visibility 1s ease;
        }
        @keyframes splashBg { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .splash-logo { font-size: 42px; font-weight: 800; color: #ffffff; letter-spacing: 2px; opacity: 0; animation: glowFade 2.5s ease-in-out forwards; display: flex; align-items: center; gap: 15px; }
        .splash-sub { font-size: 14px; color: var(--accent); margin-top: 15px; font-weight: 600; letter-spacing: 4px; text-transform: uppercase; opacity: 0; animation: glowFade 2s ease-in-out forwards 1s; }
        @keyframes glowFade { 0% { opacity: 0; text-shadow: 0 0 0px rgba(59, 130, 246, 0); transform: scale(0.95); } 50% { opacity: 1; text-shadow: 0 0 25px rgba(59, 130, 246, 0.8), 0 0 50px rgba(59, 130, 246, 0.5); transform: scale(1.05); } 100% { opacity: 1; text-shadow: 0 0 15px rgba(59, 130, 246, 0.6); transform: scale(1); } }
        .splash-hidden { opacity: 0 !important; visibility: hidden !important; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="splash-logo"><i class="fa-solid fa-film"></i> LumiFrame</div>
        <div class="splash-sub">Animation Studio</div>
    </div>

    <!-- TOP HEADER -->
    <header class="app-header">
        <button class="header-btn" onclick="app.ui.modals.open('modal-menu')"><i class="fa-solid fa-bars"></i></button>
        <div class="header-title" id="top-frame-counter">Frame 1/1</div>
        <div class="header-actions">
            <button class="header-btn" onclick="app.history.undo()"><i class="fa-solid fa-rotate-left"></i></button>
            <button class="header-btn play-btn" id="btn-play-top" onclick="app.playback.togglePlay()"><i class="fa-solid fa-play"></i></button>
        </div>
    </header>

    <!-- FLOATING TEXT EDITOR TOAST -->
    <div id="text-edit-toast" class="text-toast">
        <div class="text-toast-row">
            <input type="text" id="floating-text-input" class="text-toast-input" placeholder="Type text..." oninput="app.objects.updateTextLive(this.value)">
            <button class="text-toast-btn primary" onclick="app.objects.applyText()"><i class="fa-solid fa-check"></i></button>
        </div>
        <div class="text-toast-row">
            <select id="floating-font-select" class="text-toast-select" onchange="app.objects.setTextStyle('fontFamily', this.value)">
                <option value="sans-serif">Sans Serif</option>
                <option value="serif">Serif</option>
                <option value="monospace">Monospace</option>
                <option value="cursive">Cursive</option>
            </select>
            <button class="text-toast-btn" onclick="app.objects.toggleTextStyle('fontWeight', 'bold', 'normal')"><i class="fa-solid fa-bold"></i></button>
            <button class="text-toast-btn" onclick="app.objects.toggleTextStyle('fontStyle', 'italic', 'normal')"><i class="fa-solid fa-italic"></i></button>
        </div>
    </div>

    <!-- CENTER WORKSPACE -->
    <main class="workspace" id="workspace">
        <div class="canvas-wrapper" id="canvas-wrapper" style="width: 1080px; height: 1920px;">
            <canvas id="onion-prev" class="canvas-layer" width="1080" height="1920"></canvas>
            <div id="main-canvas-container" class="canvas-layer">
                <canvas id="main-canvas" width="1080" height="1920"></canvas>
                <!-- Alignment Snap Guidelines -->
                <div id="guide-v" class="snap-guide"></div>
                <div id="guide-h" class="snap-guide"></div>
            </div>
            <canvas id="onion-next" class="canvas-layer" width="1080" height="1920"></canvas>
        </div>
        
        <!-- SMOOTH FLOATING EDIT MENU -->
        <div class="floating-controls">
            <button class="floating-btn" id="btn-edit-menu" onclick="app.ui.toggleEditMenu()">
                <i class="fa-solid fa-pen-to-square"></i>
            </button>
            <div class="floating-dropdown-menu" id="edit-dropdown-menu">
                <button class="floating-btn" onclick="app.workspace.autoFit(); app.ui.toggleEditMenu()" title="Fit Screen"><i class="fa-solid fa-expand"></i></button>
                <button class="floating-btn" onclick="app.frames.duplicateFrame(); app.ui.toggleEditMenu()" title="Duplicate Frame"><i class="fa-solid fa-copy"></i></button>
                <button class="floating-btn" onclick="app.canvas.clear(); app.ui.toggleEditMenu()" title="Clear Canvas"><i class="fa-solid fa-eraser"></i></button>
                <button class="floating-btn" style="color: var(--danger);" onclick="app.frames.deleteFrame(app.state.currentFrameIndex); app.ui.toggleEditMenu()" title="Delete Frame"><i class="fa-solid fa-trash"></i></button>
            </div>
        </div>
    </main>

    <!-- HORIZONTAL TIMELINE -->
    <div class="timeline-bar" id="timeline-tracks"></div>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <button class="nav-btn active" data-tool="brush" onclick="app.tools.setTool('brush')">
            <i class="fa-solid fa-paint-brush"></i><div class="nav-btn-indicator"></div>
        </button>
        <button class="nav-btn" data-tool="eraser" onclick="app.tools.setTool('eraser')">
            <i class="fa-solid fa-eraser"></i><div class="nav-btn-indicator"></div>
        </button>
        <button class="nav-btn" data-tool="select" onclick="app.tools.setTool('select')">
            <i class="fa-solid fa-arrow-pointer"></i><div class="nav-btn-indicator"></div>
        </button>
        <button class="nav-btn" onclick="app.ui.modals.open('modal-objects'); app.ui.showObjectTab('shape');">
            <i class="fa-solid fa-cube"></i><div class="nav-btn-indicator"></div>
        </button>
        <div class="color-picker-wrapper">
            <input type="color" id="primary-color" value="#ffffff" onchange="app.tools.setColor(this.value)">
        </div>
        <button class="nav-btn" onclick="app.ui.modals.open('modal-settings')">
            <i class="fa-solid fa-sliders"></i><div class="nav-btn-indicator"></div>
        </button>
    </nav>


    <!-- ================= MODALS & BOTTOM SHEETS ================= -->

    <!-- Compact Objects & Shapes Panel -->
    <div class="modal-overlay transparent-overlay" id="modal-objects" onclick="app.ui.modals.closeOnClickOutside(event, 'modal-objects')">
        <div class="bottom-sheet" style="padding-bottom: 30px;">
            <div class="sheet-handle"></div>
            
            <!-- ROW 1: Categories & Layers -->
            <div style="display: flex; gap: 8px; justify-content: space-between;">
                <!-- Main Tools -->
                <div style="display: flex; gap: 5px; flex: 1.5;">
                    <button id="tab-btn-shape" class="obj-btn active-tab" onclick="app.ui.showObjectTab('shape')"><i class="fa-solid fa-shapes"></i></button>
                    <button id="tab-btn-text" class="obj-btn" onclick="app.tools.addText()"><i class="fa-solid fa-font"></i></button>
                    <button id="tab-btn-image" class="obj-btn" onclick="app.ui.showObjectTab('image')"><i class="fa-regular fa-image"></i></button>
                </div>
                <div style="width: 1px; background: var(--border-color); margin: 0 2px;"></div>
                <!-- Layers & Actions -->
                <div style="display: flex; gap: 5px; flex: 1.5;">
                    <button class="obj-btn" onclick="app.objects.bringForward()"><i class="fa-solid fa-arrow-up"></i></button>
                    <button class="obj-btn" onclick="app.objects.sendBackward()"><i class="fa-solid fa-arrow-down"></i></button>
                    <button class="obj-btn" style="color: var(--danger);" onclick="app.objects.deleteSelected(); app.ui.modals.close('modal-objects')"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>
            
            <!-- ROW 2: Contextual Tools -->
            <div id="ctx-shape" class="obj-tab-content">
                <button class="obj-btn" onclick="app.tools.addShape('rect'); app.ui.modals.close('modal-objects')"><i class="fa-regular fa-square"></i></button>
                <button class="obj-btn" onclick="app.tools.addShape('circle'); app.ui.modals.close('modal-objects')"><i class="fa-regular fa-circle"></i></button>
                <button class="obj-btn" onclick="app.tools.addShape('triangle'); app.ui.modals.close('modal-objects')"><i class="fa-solid fa-caret-up"></i></button>
                <button class="obj-btn" onclick="app.tools.addShape('star'); app.ui.modals.close('modal-objects')"><i class="fa-regular fa-star"></i></button>
            </div>

            <div id="ctx-image" class="obj-tab-content" style="display: none; flex-direction: column;">
                <div style="display: flex; gap: 5px;">
                    <button class="obj-btn" style="flex: 1;" onclick="document.getElementById('import-image').click(); app.ui.modals.close('modal-objects')"><i class="fa-solid fa-upload" style="margin-right: 8px;"></i> Upload Image</button>
                </div>
                <div style="display: flex; gap: 5px;">
                    <button class="obj-btn" onclick="app.objects.applyImageFilter('none')"><i class="fa-solid fa-image"></i></button>
                    <button class="obj-btn" onclick="app.objects.applyImageFilter('grayscale')" title="B&W"><i class="fa-solid fa-moon"></i></button>
                    <button class="obj-btn" onclick="app.objects.applyImageFilter('sepia')" title="Sepia"><i class="fa-solid fa-palette"></i></button>
                    <button class="obj-btn" onclick="app.objects.applyImageFilter('invert')" title="Invert"><i class="fa-solid fa-circle-half-stroke"></i></button>
                </div>
            </div>
            
        </div>
    </div>

    <!-- Menus & Settings -->
    <div class="modal-overlay" id="modal-menu" onclick="app.ui.modals.closeOnClickOutside(event, 'modal-menu')">
        <div class="bottom-sheet">
            <div class="sheet-handle"></div>
            <div class="sheet-title">LumiFrame</div>
            <div class="btn-list">
                <button class="btn-list-item" onclick="app.ui.modals.close('modal-menu'); app.ui.modals.open('modal-new-project')"><i class="fa-solid fa-file-circle-plus"></i> New Project</button>
                <button class="btn-list-item" onclick="document.getElementById('import-project').click()"><i class="fa-solid fa-folder-open"></i> Open Project</button>
                <button class="btn-list-item" onclick="app.project.saveProject()"><i class="fa-solid fa-download"></i> Save Project File</button>
                <button class="btn-list-item" onclick="app.ui.modals.close('modal-menu'); app.export.startExport('webm')"><i class="fa-solid fa-file-video"></i> Export Video (WebM)</button>
                <button class="btn-list-item" onclick="app.ui.modals.close('modal-menu'); app.export.startExport('png')"><i class="fa-solid fa-image"></i> Export Current Frame</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-settings" onclick="app.ui.modals.closeOnClickOutside(event, 'modal-settings')">
        <div class="bottom-sheet">
            <div class="sheet-handle"></div>
            <div class="sheet-title">Tool & Canvas Settings</div>
            <div class="prop-group"><label><span>Brush Size</span> <span id="brush-size-val">5px</span></label><div class="prop-controls"><input type="range" id="brush-size" min="1" max="100" value="5" oninput="app.tools.setBrushSize(this.value)"></div></div>
            <div class="prop-group"><label><span>Brush Opacity</span> <span id="brush-opacity-val">100%</span></label><div class="prop-controls"><input type="range" id="brush-opacity" min="0.1" max="1" step="0.1" value="1" oninput="app.tools.setBrushOpacity(this.value)"></div></div>
            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">
            <div class="prop-group"><label><span>Onion Skin Transparency</span></label><div class="prop-controls"><input type="range" id="onion-opacity" min="0" max="1" step="0.1" value="0.3" oninput="app.onionSkin.setOpacity(this.value)"></div></div>
            <div class="prop-group"><label><span>Playback FPS</span> <span id="fps-val">12</span></label><div class="prop-controls"><input type="range" id="fps-input" min="1" max="60" value="12" oninput="app.playback.setFps(this.value)"></div></div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-new-project">
        <div class="modal-center">
            <h3 style="margin-bottom: 20px;">New Project</h3>
            <div class="prop-group">
                <label>Format</label>
                <select id="preset-select" onchange="app.ui.handlePresetSelect(this.value)">
                    <option value="1080x1920">Mobile Portrait (1080x1920)</option>
                    <option value="1080x1080">Social Square (1080x1080)</option>
                    <option value="1920x1080">Landscape (1920x1080)</option>
                    <option value="custom">Custom...</option>
                </select>
            </div>
            <div style="display:flex; gap:10px;" id="custom-size-inputs">
                <div class="prop-group" style="flex:1;"><label>Width</label><input type="number" id="new-proj-w" value="1080"></div>
                <div class="prop-group" style="flex:1;"><label>Height</label><input type="number" id="new-proj-h" value="1920"></div>
            </div>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="btn-list-item" style="flex:1; justify-content:center;" onclick="app.ui.modals.close('modal-new-project')">Cancel</button>
                <button class="btn-primary" style="flex:1;" onclick="app.project.createNew()">Create</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-export">
        <div class="modal-center" style="text-align: center;">
            <h3 style="margin-bottom: 10px;">Rendering Video</h3>
            <p style="font-size: 13px; color: var(--text-muted);">Please keep the app open...</p>
            <div style="margin: 20px 0; width: 100%; height: 8px; background: var(--bg-base); border-radius: 4px; overflow: hidden;"><div id="export-progress" style="width: 0%; height: 100%; background: var(--accent); transition: 0.1s;"></div></div>
            <p id="export-status" style="font-size: 12px; font-weight:bold;">Frame 1...</p>
        </div>
    </div>

    <input type="file" id="import-project" accept=".json" style="display: none;" onchange="app.project.loadProject(event)">
    <input type="file" id="import-image" accept="image/*" style="display: none;" onchange="app.tools.addImage(event)">

    <script>
        const enforceScrollLock = () => { window.scrollTo(0, 0); document.body.scrollTop = 0; document.documentElement.scrollTop = 0; };
        window.addEventListener('scroll', enforceScrollLock, { passive: false });
        window.addEventListener('resize', enforceScrollLock);
        document.addEventListener('focusin', enforceScrollLock);
        
        fabric.filterBackend = new fabric.Canvas2dFilterBackend();
        fabric.devicePixelRatio = 1; 

        const app = {
            state: {
                width: 1080, height: 1920, fps: 12, frames: [], currentFrameIndex: 0, isPlaying: false, isLooping: true,
                tools: { active: 'brush', color: '#ffffff', size: 5, opacity: 1 },
                onionSkin: { enabled: true, opacity: 0.3 }, project: { bgColor: '#ffffff', transparent: true },
                history: { undoStack: [], redoStack: [], max: 15 },
                workspace: { scale: 1, panX: 0, panY: 0, isDragging: false, lastPosX: 0, lastPosY: 0, pinchStartDist: 0, pinchStartScale: 1 }
            },
            
            canvas: null, ctxPrev: null, ctxNext: null,
            
            init: function() {
                this.setupCanvas();
                this.frames.createInitial();
                this.tools.setTool('brush');
                this.ui.updateTimeline();
                document.getElementById('new-proj-w').value = this.state.width;
                document.getElementById('new-proj-h').value = this.state.height;
                
                document.getElementById('workspace').addEventListener('scroll', function() { this.scrollLeft = 0; this.scrollTop = 0; });
                setTimeout(() => this.workspace.autoFit(), 100);
            },
            
            setupCanvas: function() {
                this.canvas = new fabric.Canvas('main-canvas', {
                    width: this.state.width, height: this.state.height,
                    preserveObjectStacking: true, selection: true, isDrawingMode: true, enableRetinaScaling: false 
                });

                this.ctxPrev = document.getElementById('onion-prev').getContext('2d');
                this.ctxNext = document.getElementById('onion-next').getContext('2d');
                this.canvas.freeDrawingBrush = new fabric.PencilBrush(this.canvas);
                this.tools.updateBrush();

                this.canvas.on('object:added', () => { 
                    if(!this.state.isPlaying) { this.history.saveState(); this.frames.updateThumbnailAsync(); } 
                });
                this.canvas.on('object:modified', () => { 
                    if(!this.state.isPlaying) { this.history.saveState(); this.frames.updateThumbnailAsync(); } 
                });
                
                // --- ALIGNMENT SNAP LOGIC ---
                this.canvas.on('object:moving', (e) => {
                    const obj = e.target;
                    // Dynamically calculate threshold so it feels the same regardless of zoom scale
                    const threshold = 15 / app.state.workspace.scale;
                    const centerX = app.state.width / 2;
                    const centerY = app.state.height / 2;
                    const objCenter = obj.getCenterPoint();

                    let snappedX = false;
                    let snappedY = false;

                    // Horizontal Centering
                    if (Math.abs(objCenter.x - centerX) < threshold) {
                        obj.setPositionByOrigin(new fabric.Point(centerX, objCenter.y), 'center', 'center');
                        snappedX = true;
                    }

                    // Recalculate center after potential X-shift
                    const newObjCenter = obj.getCenterPoint();

                    // Vertical Centering
                    if (Math.abs(newObjCenter.y - centerY) < threshold) {
                        obj.setPositionByOrigin(new fabric.Point(newObjCenter.x, centerY), 'center', 'center');
                        snappedY = true;
                    }

                    // Toggle glowing guide lines
                    document.getElementById('guide-v').style.display = snappedX ? 'block' : 'none';
                    document.getElementById('guide-h').style.display = snappedY ? 'block' : 'none';
                });

                // Clear snap guidelines when mouse is released
                this.canvas.on('mouse:up', () => {
                    document.getElementById('guide-v').style.display = 'none';
                    document.getElementById('guide-h').style.display = 'none';
                });
                // -----------------------------

                this.canvas.on('path:created', (e) => {
                    if (this.state.workspace.isDragging || this.state.workspace.resumeDrawing) { this.canvas.remove(e.path); return; }
                    this.frames.updateThumbnailAsync();
                    if(!this.state.isPlaying) this.history.saveState();
                });
                
                this.canvas.on('selection:cleared', () => { 
                    app.ui.hideTextToast(); 
                    app.ui.updateShapePanelContext();
                });
                this.canvas.on('selection:updated', () => { app.ui.updateShapePanelContext(); });
                this.canvas.on('selection:created', () => { app.ui.updateShapePanelContext(); });

                let lastTap = 0;
                this.canvas.on('mouse:down', (opt) => {
                    const currentTime = new Date().getTime();
                    const tapLength = currentTime - lastTap;
                    if (tapLength < 350 && tapLength > 0 && opt.target && (opt.target.type === 'text' || opt.target.type === 'i-text')) {
                        app.ui.modals.close('modal-objects');
                        app.ui.showTextToast(opt.target);
                    }
                    lastTap = currentTime;
                });

                this.setupTouchGestures();
            },

            setupTouchGestures: function() {
                const ws = document.getElementById('workspace');
                ws.addEventListener('touchstart', (e) => {
                    if (e.touches.length >= 2) {
                        e.preventDefault(); this.state.workspace.isDragging = true;
                        if (app.canvas.isDrawingMode) { app.canvas.isDrawingMode = false; app.state.workspace.resumeDrawing = true; }
                        this.state.workspace.lastPosX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                        this.state.workspace.lastPosY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                        this.state.workspace.pinchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                        this.state.workspace.pinchStartScale = this.state.workspace.scale;
                    }
                }, { passive: false });

                window.addEventListener('touchmove', (e) => {
                    if (this.state.workspace.isDragging && e.touches.length >= 2) {
                        e.preventDefault();
                        const currentX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                        const currentY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                        this.state.workspace.panX += (currentX - this.state.workspace.lastPosX);
                        this.state.workspace.panY += (currentY - this.state.workspace.lastPosY);
                        this.state.workspace.lastPosX = currentX; this.state.workspace.lastPosY = currentY;
                        const currentDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                        const scaleMod = currentDist / this.state.workspace.pinchStartDist;
                        this.state.workspace.scale = Math.max(0.05, Math.min(this.state.workspace.pinchStartScale * scaleMod, 3));
                        this.workspace.applyTransform();
                    }
                }, { passive: false });

                window.addEventListener('touchend', (e) => {
                    if (e.touches.length < 2 && this.state.workspace.isDragging) {
                        this.state.workspace.isDragging = false;
                        setTimeout(() => { if (app.state.workspace.resumeDrawing) { app.canvas.isDrawingMode = true; app.state.workspace.resumeDrawing = false; } }, 50);
                    }
                });
            },
            
            workspace: {
                autoFit: function() {
                    const ws = document.getElementById('workspace');
                    const wScale = ws.clientWidth / app.state.width; 
                    const hScale = ws.clientHeight / app.state.height;
                    app.state.workspace.scale = Math.min(wScale, hScale) * 0.95; 
                    app.state.workspace.panX = 0; 
                    app.state.workspace.panY = 0; 
                    this.applyTransform();
                },
                applyTransform: function() {
                    document.getElementById('canvas-wrapper').style.transform = `translate(${app.state.workspace.panX}px, ${app.state.workspace.panY}px) scale(${app.state.workspace.scale})`;
                }
            },

            tools: {
                setTool: function(toolName) {
                    app.state.tools.active = toolName;
                    document.querySelectorAll('.nav-btn[data-tool]').forEach(b => b.classList.remove('active'));
                    const btn = document.querySelector(`.nav-btn[data-tool="${toolName}"]`);
                    if(btn) btn.classList.add('active');

                    app.canvas.isDrawingMode = false; app.canvas.selection = false;
                    app.canvas.forEachObject(o => { o.selectable = false; o.evented = false; });

                    switch(toolName) {
                        case 'select': app.canvas.selection = true; app.canvas.forEachObject(o => { o.selectable = true; o.evented = true; }); break;
                        case 'brush': app.canvas.isDrawingMode = true; app.canvas.freeDrawingBrush = new fabric.PencilBrush(app.canvas); this.updateBrush(); break;
                        case 'eraser':
                            app.canvas.isDrawingMode = true; const eraserBrush = new fabric.PencilBrush(app.canvas);
                            eraserBrush.color = '#ffffff'; eraserBrush.width = app.state.tools.size; app.canvas.freeDrawingBrush = eraserBrush;
                            app.canvas.off('path:created');
                            app.canvas.on('path:created', function(e) {
                                if (app.state.workspace.isDragging || app.state.workspace.resumeDrawing) { app.canvas.remove(e.path); return; }
                                if (app.state.tools.active === 'eraser') {
                                    e.path.globalCompositeOperation = 'destination-out';
                                    app.canvas.renderAll(); app.frames.updateThumbnailAsync();
                                    if(!app.state.isPlaying) app.history.saveState();
                                }
                            }); break;
                    }
                    if (toolName !== 'eraser') {
                        app.canvas.off('path:created');
                        app.canvas.on('path:created', (e) => {
                            if (app.state.workspace.isDragging || app.state.workspace.resumeDrawing) { app.canvas.remove(e.path); return; }
                            app.frames.updateThumbnailAsync(); if(!app.state.isPlaying) app.history.saveState();
                        });
                    }
                    app.canvas.discardActiveObject(); app.canvas.requestRenderAll();
                },
                setColor: function(hex) {
                    app.state.tools.color = hex; this.updateBrush();
                    const activeObjects = app.canvas.getActiveObjects();
                    if (activeObjects.length) {
                        activeObjects.forEach(obj => { if (obj.type === 'path') obj.set('stroke', hex); else obj.set('fill', hex); });
                        app.canvas.renderAll(); app.history.saveState(); app.frames.updateThumbnailAsync();
                    }
                },
                setBrushSize: function(size) { app.state.tools.size = parseInt(size); document.getElementById('brush-size-val').textContent = size + 'px'; this.updateBrush(); },
                setBrushOpacity: function(op) { app.state.tools.opacity = parseFloat(op); document.getElementById('brush-opacity-val').textContent = Math.round(op * 100) + '%'; this.updateBrush(); },
                updateBrush: function() {
                    if (!app.canvas.freeDrawingBrush) return;
                    const hex = app.state.tools.color, r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
                    if (app.state.tools.active !== 'eraser') { app.canvas.freeDrawingBrush.color = `rgba(${r},${g},${b},${app.state.tools.opacity})`; }
                    app.canvas.freeDrawingBrush.width = app.state.tools.size;
                },
                getVisibleCenter: function() {
                    const wrapper = document.getElementById('canvas-wrapper'); const rect = wrapper.getBoundingClientRect(); const scale = app.state.workspace.scale;
                    const x = (window.innerWidth / 2 - rect.left) / scale; const y = (window.innerHeight / 2 - rect.top) / scale;
                    return { left: x, top: y };
                },
                addShape: function(type) {
                    let shape; const center = this.getVisibleCenter(); const color = app.state.tools.color; const dim = Math.min(app.state.width, app.state.height) * 0.2;
                    if (type === 'rect') shape = new fabric.Rect({ left: center.left, top: center.top, originX: 'center', originY: 'center', width: dim, height: dim, fill: color });
                    else if (type === 'circle') shape = new fabric.Circle({ left: center.left, top: center.top, originX: 'center', originY: 'center', radius: dim/2, fill: color });
                    else if (type === 'triangle') shape = new fabric.Triangle({ left: center.left, top: center.top, originX: 'center', originY: 'center', width: dim, height: dim, fill: color });
                    else if (type === 'star') {
                        const spikes = 5, outerRadius = dim/2, innerRadius = dim/4; let rot = Math.PI/2*3, x = center.left, y = center.top, step = Math.PI/spikes, path = [];
                        for(let i=0; i<spikes; i++) { path.push({x: x + Math.cos(rot)*outerRadius, y: y + Math.sin(rot)*outerRadius}); rot += step; path.push({x: x + Math.cos(rot)*innerRadius, y: y + Math.sin(rot)*innerRadius}); rot += step; }
                        shape = new fabric.Polygon(path, { fill: color, left: center.left, top: center.top, originX: 'center', originY: 'center' });
                    }
                    if (shape) { app.canvas.add(shape); app.canvas.setActiveObject(shape); app.tools.setTool('select'); app.history.saveState(); app.frames.updateThumbnailAsync(); }
                },
                addText: function() {
                    const center = this.getVisibleCenter();
                    const text = new fabric.Text('Text', {
                        left: center.left, top: center.top, originX: 'center', originY: 'center', editable: false,
                        fontFamily: 'sans-serif', fill: app.state.tools.color, fontSize: Math.min(app.state.width, app.state.height) * 0.1
                    });
                    app.canvas.add(text); app.canvas.setActiveObject(text); app.tools.setTool('select');
                    app.history.saveState(); app.frames.updateThumbnailAsync();
                    
                    app.ui.modals.close('modal-objects');
                    app.ui.showTextToast(text);
                },
                addImage: function(e) {
                    const file = e.target.files[0]; if (!file) return;
                    const reader = new FileReader();
                    reader.onload = function(f) {
                        fabric.Image.fromURL(f.target.result, function(img) {
                            const maxDim = Math.min(app.state.width, app.state.height) * 0.6;
                            if (img.width > maxDim || img.height > maxDim) { const scale = maxDim / Math.max(img.width, img.height); img.scale(scale); }
                            const center = app.tools.getVisibleCenter();
                            img.set({ left: center.left, top: center.top, originX: 'center', originY: 'center' });
                            app.canvas.add(img); app.canvas.setActiveObject(img); app.tools.setTool('select');
                            app.history.saveState(); app.frames.updateThumbnailAsync();
                        });
                    };
                    reader.readAsDataURL(file); e.target.value = '';
                }
            },

            objects: {
                updateTextLive: function(val) {
                    const obj = app.canvas.getActiveObject();
                    if (obj && (obj.type === 'text' || obj.type === 'i-text')) {
                        obj.set('text', val || ' ');
                        app.canvas.requestRenderAll();
                    }
                },
                applyText: function() {
                    app.history.saveState();
                    app.frames.updateThumbnailAsync();
                    app.ui.hideTextToast();
                },
                setTextStyle: function(prop, val) {
                    const obj = app.canvas.getActiveObject();
                    if (obj && (obj.type === 'text' || obj.type === 'i-text')) {
                        obj.set(prop, val); app.canvas.requestRenderAll(); app.history.saveState(); app.frames.updateThumbnailAsync();
                    }
                },
                toggleTextStyle: function(prop, onVal, offVal) {
                    const obj = app.canvas.getActiveObject();
                    if (obj && (obj.type === 'text' || obj.type === 'i-text')) {
                        obj.set(prop, obj.get(prop) === onVal ? offVal : onVal);
                        app.canvas.requestRenderAll(); app.history.saveState(); app.frames.updateThumbnailAsync();
                    }
                },
                applyImageFilter: function(type) {
                    const obj = app.canvas.getActiveObject();
                    if (obj && obj.type === 'image') {
                        obj.filters = [];
                        if (type === 'grayscale') obj.filters.push(new fabric.Image.filters.Grayscale());
                        else if (type === 'sepia') obj.filters.push(new fabric.Image.filters.Sepia());
                        else if (type === 'invert') obj.filters.push(new fabric.Image.filters.Invert());
                        obj.applyFilters(); app.canvas.requestRenderAll(); app.history.saveState(); app.frames.updateThumbnailAsync();
                    }
                },
                deleteSelected: function() {
                    const activeObjects = app.canvas.getActiveObjects();
                    if (activeObjects.length) {
                        app.canvas.discardActiveObject(); activeObjects.forEach(obj => app.canvas.remove(obj));
                        app.history.saveState(); app.frames.updateThumbnailAsync(); app.ui.hideTextToast();
                    }
                },
                bringForward: function() { const active = app.canvas.getActiveObject(); if(active) { app.canvas.bringForward(active); app.history.saveState(); app.frames.updateThumbnailAsync(); } },
                sendBackward: function() { const active = app.canvas.getActiveObject(); if(active) { app.canvas.sendBackwards(active); app.history.saveState(); app.frames.updateThumbnailAsync(); } }
            },

            frames: {
                createInitial: function() { this.addFrame(true); },
                saveCurrentFrame: function() {
                    if (app.state.frames.length === 0 || app.state.isPlaying) return;
                    app.state.frames[app.state.currentFrameIndex].data = JSON.stringify(app.canvas.toJSON(['id']));
                    
                    const dataUrl = app.canvas.toDataURL({ format: 'png', multiplier: 0.2 });
                    app.state.frames[app.state.currentFrameIndex].thumb = dataUrl;
                    const thumbImg = document.getElementById(`thumb-img-${app.state.currentFrameIndex}`);
                    if(thumbImg) thumbImg.src = dataUrl;
                },
                
                loadFrame: function(index, skipSave = false) {
                    if (index < 0 || index >= app.state.frames.length) return;
                    
                    if (!app.state.isPlaying && !skipSave) { 
                        this.saveCurrentFrame(); 
                        app.history.clear(); 
                    } else if (!app.state.isPlaying && skipSave) {
                        app.history.clear();
                    }
                    
                    app.state.currentFrameIndex = index;
                    
                    const frame = app.state.frames[index];
                    if (frame && frame.data) {
                        app.canvas.loadFromJSON(frame.data, () => {
                            app.canvas.renderAll();
                            if (!app.state.isPlaying) { app.onionSkin.render(); app.history.saveState(); }
                        });
                    } else {
                        app.canvas.clear();
                        if (!app.state.isPlaying) { app.onionSkin.render(); app.history.saveState(); }
                    }
                    if (app.state.isPlaying) app.ui.updateTimelineActiveOnly(); else app.ui.updateTimeline();
                },
                addFrame: function(isInit = false) {
                    if(!isInit) this.saveCurrentFrame();
                    const newFrame = { id: Date.now(), data: null, thumb: '' };
                    const insertIdx = isInit ? 0 : app.state.currentFrameIndex + 1;
                    app.state.frames.splice(insertIdx, 0, newFrame);
                    if(!isInit) { this.loadFrame(insertIdx, true); this.updateThumbnailAsync(); } else { app.ui.updateTimeline(); }
                },
                duplicateFrame: function() {
                    this.saveCurrentFrame();
                    const currentData = app.state.frames[app.state.currentFrameIndex].data;
                    const newFrame = { id: Date.now(), data: currentData, thumb: app.state.frames[app.state.currentFrameIndex].thumb };
                    const insertIdx = app.state.currentFrameIndex + 1;
                    app.state.frames.splice(insertIdx, 0, newFrame); this.loadFrame(insertIdx, true);
                },
                deleteFrame: function(index) {
                    if (app.state.frames.length <= 1) { app.canvas.clear(); this.updateThumbnailAsync(); return; }
                    
                    const deletingCurrent = (index === app.state.currentFrameIndex);
                    if (!deletingCurrent) { this.saveCurrentFrame(); }
                    
                    app.state.frames.splice(index, 1);
                    if (app.state.currentFrameIndex >= index) app.state.currentFrameIndex = Math.max(0, app.state.currentFrameIndex - 1);
                    
                    this.loadFrame(app.state.currentFrameIndex, true);
                },
                updateThumbnailAsync: function() {
                    setTimeout(() => {
                        if(app.state.isPlaying) return;
                        const dataUrl = app.canvas.toDataURL({ format: 'png', multiplier: 0.2 });
                        app.state.frames[app.state.currentFrameIndex].thumb = dataUrl;
                        const thumbImg = document.getElementById(`thumb-img-${app.state.currentFrameIndex}`);
                        if(thumbImg) thumbImg.src = dataUrl;
                    }, 50);
                }
            },

            onionSkin: {
                setOpacity: function(val) { app.state.onionSkin.opacity = parseFloat(val); this.render(); },
                render: function() {
                    const ctxP = app.ctxPrev, ctxN = app.ctxNext, w = app.state.width, h = app.state.height;
                    ctxP.clearRect(0, 0, w, h); ctxN.clearRect(0, 0, w, h);
                    if (!app.state.onionSkin.enabled || app.state.isPlaying) return;
                    const idx = app.state.currentFrameIndex;
                    if (idx > 0 && app.state.frames[idx-1].thumb) this.drawTinted(ctxP, app.state.frames[idx-1].thumb, '255,0,0', app.state.onionSkin.opacity);
                    if (idx < app.state.frames.length - 1 && app.state.frames[idx+1].thumb) this.drawTinted(ctxN, app.state.frames[idx+1].thumb, '0,255,0', app.state.onionSkin.opacity);
                },
                drawTinted: function(ctx, dataUrl, rgbStr, alpha) {
                    const img = new Image();
                    img.onload = () => {
                        ctx.save(); ctx.globalAlpha = alpha; ctx.drawImage(img, 0, 0, app.state.width, app.state.height);
                        ctx.globalCompositeOperation = "source-atop"; ctx.fillStyle = `rgb(${rgbStr})`;
                        ctx.fillRect(0, 0, app.state.width, app.state.height); ctx.restore();
                    };
                    img.src = dataUrl;
                }
            },

            playback: {
                interval: null,
                togglePlay: function() {
                    if (!app.state.isPlaying) app.frames.saveCurrentFrame(); 
                    app.state.isPlaying = !app.state.isPlaying;
                    const btnTop = document.getElementById('btn-play-top');
                    if (app.state.isPlaying) {
                        btnTop.innerHTML = '<i class="fa-solid fa-pause"></i>'; btnTop.classList.add('active');
                        app.ctxPrev.clearRect(0, 0, app.state.width, app.state.height); app.ctxNext.clearRect(0, 0, app.state.width, app.state.height);
                        app.canvas.isDrawingMode = false; app.canvas.selection = false; app.ui.hideTextToast();
                        app.canvas.forEachObject(o => o.selectable = false); app.canvas.discardActiveObject(); app.canvas.requestRenderAll();
                        this.startLoop();
                    } else {
                        btnTop.innerHTML = '<i class="fa-solid fa-play"></i>'; btnTop.classList.remove('active');
                        this.stopLoop(); app.tools.setTool(app.state.tools.active); app.onionSkin.render(); app.ui.updateTimeline();
                    }
                },
                startLoop: function() {
                    const timePerFrame = 1000 / app.state.fps; let lastTime = performance.now();
                    const tick = (now) => {
                        if (!app.state.isPlaying) return;
                        const delta = now - lastTime;
                        if (delta >= timePerFrame) { this.nextFrame(true); lastTime = now - (delta % timePerFrame); }
                        this.interval = requestAnimationFrame(tick);
                    };
                    this.interval = requestAnimationFrame(tick);
                },
                stopLoop: function() { if(this.interval) { cancelAnimationFrame(this.interval); this.interval = null; } },
                nextFrame: function(fromPlayback = false) {
                    let nextIdx = app.state.currentFrameIndex + 1;
                    if (nextIdx >= app.state.frames.length) { if (app.state.isLooping || fromPlayback) nextIdx = 0; else return; }
                    app.frames.loadFrame(nextIdx);
                },
                setFps: function(val) { app.state.fps = parseInt(val) || 12; document.getElementById('fps-val').textContent = app.state.fps; }
            },

            history: {
                saveState: function() {
                    if(app.state.isPlaying || app.state.workspace.isDragging || app.state.workspace.resumeDrawing) return;
                    app.state.history.undoStack.push(JSON.stringify(app.canvas.toJSON(['id'])));
                    if (app.state.history.undoStack.length > app.state.history.max) app.state.history.undoStack.shift();
                    app.state.history.redoStack = [];
                },
                undo: function() {
                    if (app.state.history.undoStack.length > 1) {
                        const current = app.state.history.undoStack.pop(); app.state.history.redoStack.push(current);
                        const prevState = app.state.history.undoStack[app.state.history.undoStack.length - 1];
                        app.canvas.loadFromJSON(prevState, () => { app.canvas.renderAll(); app.frames.updateThumbnailAsync(); });
                    }
                },
                clear: function() { app.state.history.undoStack = []; app.state.history.redoStack = []; }
            },

            export: {
                startExport: async function(format) {
                    if (app.state.isPlaying) app.playback.togglePlay(); app.frames.saveCurrentFrame();
                    if (format === 'png') {
                        const multiplier = 1 / (app.canvas.getRetinaScaling() || 1);
                        const link = document.createElement('a'); link.download = `frame_${app.state.currentFrameIndex + 1}.png`;
                        link.href = app.canvas.toDataURL({ format: 'png', multiplier: multiplier }); link.click(); return;
                    }
                    if (format === 'webm') {
                        app.ui.modals.open('modal-export');
                        const progress = document.getElementById('export-progress'), statusText = document.getElementById('export-status');
                        const expCanvas = document.createElement('canvas'); expCanvas.width = app.state.width; expCanvas.height = app.state.height;
                        const expCtx = expCanvas.getContext('2d');
                        const stream = expCanvas.captureStream(app.state.fps);
                        let mimeType = MediaRecorder.isTypeSupported('video/webm; codecs=vp9') ? 'video/webm; codecs=vp9' : 'video/webm';
                        const recorder = new MediaRecorder(stream, { mimeType: mimeType }); const chunks = [];
                        recorder.ondataavailable = e => chunks.push(e.data);
                        recorder.onstop = () => {
                            const blob = new Blob(chunks, { type: mimeType }); const a = document.createElement('a');
                            a.href = URL.createObjectURL(blob); a.download = 'animation.webm'; a.click();
                            app.ui.modals.close('modal-export'); app.frames.loadFrame(app.state.currentFrameIndex);
                        };
                        recorder.start(); const timePerFrame = 1000 / app.state.fps;
                        for (let i = 0; i < app.state.frames.length; i++) {
                            statusText.textContent = `Frame ${i + 1} of ${app.state.frames.length}`; progress.style.width = `${((i + 1) / app.state.frames.length) * 100}%`;
                            await new Promise(resolve => {
                                const tempFab = new fabric.StaticCanvas(null, { width: app.state.width, height: app.state.height, enableRetinaScaling: false });
                                if (app.state.frames[i].data) {
                                    tempFab.loadFromJSON(app.state.frames[i].data, () => {
                                        tempFab.renderAll();
                                        if(!app.state.project.transparent) { expCtx.fillStyle = app.state.project.bgColor; expCtx.fillRect(0,0, expCanvas.width, expCanvas.height); } 
                                        else { expCtx.clearRect(0,0, expCanvas.width, expCanvas.height); }
                                        expCtx.drawImage(tempFab.getElement(), 0, 0, app.state.width, app.state.height); resolve();
                                    });
                                } else { expCtx.clearRect(0,0, expCanvas.width, expCanvas.height); resolve(); }
                            });
                            await new Promise(r => setTimeout(r, timePerFrame));
                        }
                        recorder.stop();
                    }
                }
            },

            project: {
                createNew: function() {
                    app.state.width = parseInt(document.getElementById('new-proj-w').value) || 1080; app.state.height = parseInt(document.getElementById('new-proj-h').value) || 1920;
                    app.state.frames = []; app.state.currentFrameIndex = 0;
                    app.canvas.setWidth(app.state.width); app.canvas.setHeight(app.state.height);
                    app.ctxPrev.canvas.width = app.state.width; app.ctxPrev.canvas.height = app.state.height;
                    app.ctxNext.canvas.width = app.state.width; app.ctxNext.canvas.height = app.state.height;
                    document.getElementById('canvas-wrapper').style.width = app.state.width + 'px'; document.getElementById('canvas-wrapper').style.height = app.state.height + 'px';
                    app.frames.createInitial(); app.workspace.autoFit(); app.ui.modals.close('modal-new-project');
                },
                saveProject: function() {
                    app.frames.saveCurrentFrame();
                    const blob = new Blob([JSON.stringify({ width: app.state.width, height: app.state.height, fps: app.state.fps, frames: app.state.frames })], {type: 'application/json'});
                    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'motion_project.json'; a.click();
                },
                loadProject: function(e) {
                    const file = e.target.files[0]; if(!file) return; const reader = new FileReader();
                    reader.onload = function(event) {
                        try {
                            const data = JSON.parse(event.target.result);
                            app.state.width = data.width || 1080; app.state.height = data.height || 1920; app.state.fps = data.fps || 12;
                            app.playback.setFps(app.state.fps); document.getElementById('fps-input').value = app.state.fps;
                            app.canvas.setWidth(app.state.width); app.canvas.setHeight(app.state.height);
                            app.ctxPrev.canvas.width = app.state.width; app.ctxPrev.canvas.height = app.state.height;
                            app.ctxNext.canvas.width = app.state.width; app.ctxNext.canvas.height = app.state.height;
                            document.getElementById('canvas-wrapper').style.width = app.state.width + 'px'; document.getElementById('canvas-wrapper').style.height = app.state.height + 'px';
                            app.state.frames = data.frames || []; if(app.state.frames.length === 0) app.frames.createInitial();
                            app.frames.loadFrame(0); app.workspace.autoFit(); app.ui.modals.close('modal-menu');
                        } catch (err) { alert("Failed to load project file."); }
                    };
                    reader.readAsText(file); e.target.value = '';
                }
            },

            ui: {
                updateTimeline: function() {
                    const track = document.getElementById('timeline-tracks'); track.innerHTML = '';
                    app.state.frames.forEach((frame, idx) => {
                        const thumb = document.createElement('div');
                        thumb.className = `frame-thumb ${idx === app.state.currentFrameIndex ? 'active' : ''}`;
                        thumb.onclick = () => app.frames.loadFrame(idx);
                        thumb.innerHTML = `<img id="thumb-img-${idx}" src="${frame.thumb || 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'}"><div class="frame-num">${idx + 1}</div>`;
                        track.appendChild(thumb);
                        if (idx === app.state.currentFrameIndex) thumb.scrollIntoView({ behavior: 'auto', block: 'nearest', inline: 'center' });
                    });
                    const addBtn = document.createElement('button'); addBtn.className = 'frame-add-btn'; addBtn.innerHTML = '<i class="fa-solid fa-plus"></i>';
                    addBtn.onclick = () => app.frames.addFrame(); track.appendChild(addBtn);
                    document.getElementById('top-frame-counter').innerHTML = `Frame ${app.state.currentFrameIndex + 1} <span style="color:var(--text-muted); font-size:12px;">/ ${app.state.frames.length}</span>`;
                },
                updateTimelineActiveOnly: function() {
                    document.getElementById('top-frame-counter').innerHTML = `Frame ${app.state.currentFrameIndex + 1} <span style="color:var(--text-muted); font-size:12px;">/ ${app.state.frames.length}</span>`;
                    document.querySelectorAll('.frame-thumb').forEach((el, idx) => {
                        if (idx === app.state.currentFrameIndex) { el.classList.add('active'); el.scrollIntoView({ behavior: 'auto', block: 'nearest', inline: 'center' }); } 
                        else el.classList.remove('active');
                    });
                },
                toggleEditMenu: function() {
                    const menu = document.getElementById('edit-dropdown-menu');
                    const btn = document.getElementById('btn-edit-menu');
                    menu.classList.toggle('open');
                    if (menu.classList.contains('open')) {
                        btn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                        btn.classList.add('active');
                    } else {
                        btn.innerHTML = '<i class="fa-solid fa-pen-to-square"></i>';
                        btn.classList.remove('active');
                    }
                },
                showTextToast: function(obj) {
                    const toast = document.getElementById('text-edit-toast');
                    toast.classList.add('show');
                    document.getElementById('floating-text-input').value = obj.text || '';
                    document.getElementById('floating-font-select').value = obj.fontFamily || 'sans-serif';
                },
                hideTextToast: function() {
                    document.getElementById('text-edit-toast').classList.remove('show');
                },
                showObjectTab: function(tabName) {
                    document.querySelectorAll('.obj-btn.active-tab').forEach(b => b.classList.remove('active-tab'));
                    const btn = document.getElementById(`tab-btn-${tabName}`);
                    if (btn) btn.classList.add('active-tab');
                    
                    document.getElementById('ctx-shape').style.display = 'none';
                    document.getElementById('ctx-image').style.display = 'none';
                    if (tabName !== 'text') { document.getElementById(`ctx-${tabName}`).style.display = 'flex'; }
                },
                updateShapePanelContext: function() {
                    const obj = app.canvas.getActiveObject();
                    if (obj) {
                        if (obj.type === 'i-text' || obj.type === 'text') this.showObjectTab('text');
                        else if (obj.type === 'image') this.showObjectTab('image');
                        else this.showObjectTab('shape');
                    }
                },
                handlePresetSelect: function(val) {
                    if (val === 'custom') return; const [w, h] = val.split('x');
                    document.getElementById('new-proj-w').value = w; document.getElementById('new-proj-h').value = h;
                },
                modals: {
                    open: id => document.getElementById(id).classList.add('open'),
                    close: id => document.getElementById(id).classList.remove('open'),
                    closeOnClickOutside: function(e, id) { if (e.target.id === id) this.close(id); }
                }
            }
        };

        window.onload = () => {
            app.init();
            setTimeout(() => {
                document.getElementById('splash-screen').classList.add('splash-hidden');
                setTimeout(() => app.workspace.autoFit(), 800);
            }, 3500);
        };
    </script>
</body>
</html>
